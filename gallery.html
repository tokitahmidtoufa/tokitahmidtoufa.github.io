<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KJ9NVDDR");
    </script>
    <!-- End Google Tag Manager -->
    <title>Photo Gallery — Toki Tahmid Toufa</title>
    <meta
      name="description"
      content="Photo gallery of Toki Tahmid Toufa, young tech founder and builder from Jashore, Bangladesh: more moments, experiences, and achievements."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tokitahmidtoufa.github.io/gallery.html" />
    <link rel="icon" type="image/png" href="assets/favicon.webp" />
    <link rel="apple-touch-icon" href="assets/favicon.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tokitahmidtoufa.github.io/gallery.html" />
    <meta property="og:title" content="Photo Gallery — Toki Tahmid Toufa" />
    <meta
      property="og:description"
      content="More moments, experiences, and achievements from Toki Tahmid Toufa's journey."
    />
    <meta
      property="og:image"
      content="https://tokitahmidtoufa.github.io/assets/og-image.webp"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body data-gallery="full">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KJ9NVDDR"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header id="hd">
      <div class="w">
        <nav aria-label="Main">
          <a class="logo" href="index.html#home">Toki Tahmid Toufa</a>
          <!-- nav links are filled in by script.js and point back to index.html#section -->
          <ul class="links" id="lk"></ul>
          <a class="btn p nb nd" href="index.html#contact">Let's Talk</a>
          <button class="btn nb ic" id="th" aria-label="Switch to light mode">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button
            class="btn nb ic burger"
            id="bg"
            aria-label="Menu"
            aria-expanded="false"
            aria-controls="lk"
          >
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
        </nav>
      </div>
    </header>
    <main>
      <section id="gallery" class="gl-page" aria-labelledby="gallery-title">
        <div class="w">
          <div class="gl-nav">
            <a class="btn nb" href="index.html#gallery"><b style="transform: none">←</b> Back to Portfolio</a>
            <a class="btn nb" href="index.html">Home</a>
          </div>
          <div class="hd">
            <h1 class="gl-title" id="gallery-title">Photo Gallery</h1>
            <p>
              More moments, experiences, and achievements — a wider look at the
              journey beyond the highlights.
            </p>
          </div>
          <div
            class="gl-filters"
            id="gl-filters"
            role="group"
            aria-label="Filter photos by category"
            hidden
          ></div>
          <ul class="gl" id="gl"></ul>
          <div class="gl-nav end">
            <a class="btn" href="index.html#gallery"><b style="transform: none">←</b> Back to Portfolio</a>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="w">
        <p class="fc">
          <span>Designed &amp; Built by Toki Tahmid Toufa</span>
          <span>— © 2026 All rights reserved.</span>
        </p>
      </div>
    </footer>

    <!-- Gallery lightbox (populated by script.js) -->
    <div
      class="lbx"
      id="lb"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lb-title"
      aria-describedby="lb-cap"
      hidden
    >
      <button
        class="lb-btn lb-x"
        id="lb-close"
        type="button"
        aria-label="Close photo viewer"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <button
        class="lb-btn lb-n lb-prev"
        id="lb-prev"
        type="button"
        aria-label="Previous photo"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <figure class="lb-fig">
        <div class="lb-media">
          <img id="lb-img" alt="" decoding="async" />
          <div class="lb-miss" role="img" aria-label="Photo not available yet">Photo coming soon</div>
        </div>
        <figcaption>
          <small id="lb-meta"></small>
          <h3 id="lb-title"></h3>
          <p id="lb-cap"></p>
          <span class="lb-count" id="lb-count" aria-live="polite"></span>
        </figcaption>
      </figure>
      <button
        class="lb-btn lb-n lb-next"
        id="lb-next"
        type="button"
        aria-label="Next photo"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
